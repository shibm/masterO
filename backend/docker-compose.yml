version: "3.9"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: employee_task_tracker
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: .
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: change-this-secret
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: employee_task_tracker
    ports:
      - "5000:5000"
    depends_on:
      - mysql

volumes:
  mysql_data:
